<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkyCast Pro Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body class="dark-mode">
    <div class="background-animation"></div>
    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="brand">
                    <h2>SkyCast<span>Pro</span></h2>
                </div>
                <div class="search-box">
                    <input type="text" id="city-input" placeholder="Search city..." spellcheck="false">
                    <button id="search-btn">
                        <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 1024 1024" height="1.2em" width="1.2em" xmlns="http://www.w3.org/2000/svg"><path d="M909.6 854.5L641.4 586.3C690.3 525.5 720 448.2 720 364c0-196.6-160.4-357-360-357S0 167.4 0 364s160.4 360 360 360c84.2 0 161.5-29.7 222.3-78.6l268.2 268.2c9.2 9.2 24.2 9.2 33.5 0l25.6-25.6c9.2-9.2 9.2-24.2 0-33.5zM360 640c-152.4 0-276-123.6-276-276s123.6-276 276-276 276 123.6 276 276-123.6 276-276 276z"></path></svg>
                    </button>
                </div>
                <div class="nav-links">
                    <a href="iss-tracker.html" class="glass-btn">ISS Tracker</a>
                </div>
                <div class="unit-toggle">
                    <span id="unit-c" class="active">°C</span>
                    <label class="switch">
                        <input type="checkbox" id="unit-checkbox">
                        <span class="slider round"></span>
                    </label>
                    <span id="unit-f">°F</span>
                </div>
            </div>
        </header>

        <main id="weather-display" class="hidden">
            <div class="dashboard-grid">
                <!-- Column 1: Core Info -->
                <div class="card main-card">
                    <div class="location-info">
                        <h1 id="city-name">--</h1>
                        <p id="date">--</p>
                    </div>
                    <div class="temp-main">
                        <span id="temp">--</span><span class="unit-label">°C</span>
                    </div>
                    <div class="condition">
                        <img id="weather-icon" src="" alt="icon">
                        <span id="description">--</span>
                    </div>
                    <div class="feels-bar">
                        Feels like <span id="feels-like">--</span>
                    </div>
                </div>

                <!-- Column 2: Metrics Grid -->
                <div class="card metrics-card">
                    <div class="grid-container">
                        <div class="metric">
                            <span class="label">Humidity</span>
                            <span class="value" id="humidity">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Wind</span>
                            <span class="value" id="wind-speed">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Pressure</span>
                            <span class="value" id="pressure">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Visibility</span>
                            <span class="value" id="visibility">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Clouds</span>
                            <span class="value" id="clouds">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Sea Level</span>
                            <span class="value" id="sea-level">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Grnd Level</span>
                            <span class="value" id="grnd-level">--</span>
                        </div>
                        <div class="metric">
                            <span class="label">Country</span>
                            <span class="value" id="country-code">--</span>
                        </div>
                    </div>
                </div>

                <!-- Column 3: Solar & Map -->
                <div class="card sidebar-card">
                    <div class="solar-module">
                        <div class="solar-arc-container">
                            <svg id="solar-arc" viewBox="0 0 200 100">
                                <path id="arc-path" d="M20,90 A80,80 0 0,1 180,90" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
                                <path id="arc-progress" d="M20,90 A80,80 0 0,1 180,90" fill="none" stroke="#facc15" stroke-width="2" stroke-dasharray="0 1000" />
                                <circle id="sun-marker" cx="20" cy="90" r="4" fill="#facc15" />
                            </svg>
                            <div class="sun-row">
                                <div class="sun-time">
                                    <span class="tiny-label">Sunrise</span>
                                    <span id="sunrise-time">--</span>
                                </div>
                                <div class="sun-time">
                                    <span class="tiny-label">Sunset</span>
                                    <span id="sunset-time">--</span>
                                </div>
                            </div>
                            <p id="sun-status">--</p>
                        </div>
                    </div>
                    <div id="map-module">
                        <div id="map"></div>
                    </div>
                </div>
            </div>
        </main>

        <div id="loader" class="hidden">
            <div class="spinner"></div>
        </div>

        <div id="error-message" class="hidden">
            <p>Location sync failed.</p>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script src="js/script.js"></script>
</body>
</html>
